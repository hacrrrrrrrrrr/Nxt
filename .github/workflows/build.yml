name: Kotlin Gradle Build

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure JDK 17 for the Kotlin/Android environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configure Gradle with official caching to optimize build times
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ensure the Gradle wrapper has execution permissions
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Generate the debug keystore for CI build signing
      - name: Generate debug.keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Create dummy google-services.json to satisfy the Google Services Plugin during CI
      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abc123def456","android_client_info":{"package_name":"com.nxt.esports"}},"api_key":[{"current_key":"dummy-api-key"}]}]}' > app/google-services.json

      # Run the build and execute unit tests
      - name: Build with Gradle
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: ./gradlew assembleDebug testDebugUnitTest -Djava.awt.headless=true

      # Upload the built APK as a build artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
